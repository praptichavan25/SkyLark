<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <linearGradient id="augSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#41b6c4"/>
      <stop offset="60%" stop-color="#a1dab4"/>
      <stop offset="100%" stop-color="#ffffcc"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0868ac"/>
      <stop offset="50%" stop-color="#43a2ca"/>
      <stop offset="100%" stop-color="#7bccc4"/>
    </linearGradient>
    <linearGradient id="islandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#238443"/>
      <stop offset="100%" stop-color="#78c679"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#augSky)"/>

  <!-- Emerald Ocean View below -->
  <path d="M0 240 Q 300 200 600 260 Q 750 280 900 240 L 900 600 L 0 600 Z" fill="url(#seaGrad)"/>

  <!-- Tropical Archipelago and Coral Reefs -->
  <path d="M120 440 Q 240 380 340 430 Q 380 500 260 540 Q 140 520 120 440 Z" fill="url(#islandGrad)" stroke="#f7fcb9" stroke-width="8"/>
  <path d="M480 360 Q 580 310 680 340 Q 740 410 620 460 Q 520 430 480 360 Z" fill="url(#islandGrad)" stroke="#f7fcb9" stroke-width="12"/>
  <circle cx="760" cy="480" r="45" fill="url(#islandGrad)" stroke="#f7fcb9" stroke-width="6"/>

  <!-- Soft Shorebreak & Coastal waves -->
  <path d="M0 290 Q 250 330 500 290 Q 750 320 900 280" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.5"/>
  <path d="M0 320 Q 280 370 600 330 Q 800 350 900 310" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.4"/>

  <!-- Distant Airplane Wing along the left frame -->
  <path d="M0 480 L 320 320 L 390 310 L 370 280 L 0 380 Z" fill="#ffffff" opacity="0.95" filter="drop-shadow(0px 8px 12px rgba(0,40,70,0.3))"/>
  <polygon points="320,320 390,310 380,270 355,275" fill="#e6550d"/>

  <rect width="900" height="600" fill="none" stroke="#f4efe6" stroke-width="16" rx="20"/>
</svg>
