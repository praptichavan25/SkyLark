<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <linearGradient id="octSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d1e2f"/>
      <stop offset="35%" stop-color="#7e2e3d"/>
      <stop offset="65%" stop-color="#cc5a36"/>
      <stop offset="90%" stop-color="#f28e2b"/>
      <stop offset="100%" stop-color="#f8ba43"/>
    </linearGradient>
    <radialGradient id="octSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="40%" stop-color="#fbc443"/>
      <stop offset="75%" stop-color="#ea5b2d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#cc5a36" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="600" fill="url(#octSky)"/>

  <!-- Giant Glowing Sunset Sun -->
  <circle cx="450" cy="380" r="170" fill="url(#octSun)"/>
  <circle cx="450" cy="380" r="100" fill="#fffbe6"/>

  <!-- Glowing Sunset Cloud Horizon -->
  <path d="M0 430 Q 180 390 360 410 Q 540 380 720 420 Q 820 400 900 440 L 900 600 L 0 600 Z" fill="#b33939" opacity="0.85"/>
  <path d="M0 480 Q 220 430 450 460 Q 680 420 900 470 L 900 600 L 0 600 Z" fill="#581845"/>

  <!-- Airplane Silhouetted in Front of Sunset -->
  <g transform="translate(420, 310) rotate(-4) scale(0.95)">
    <!-- Fuselage -->
    <ellipse cx="0" cy="0" rx="140" ry="18" fill="#2b091f"/>
    <!-- Wings -->
    <polygon points="-20,5 20,5 50,55 -5,55" fill="#1f0616"/>
    <polygon points="-30,-5 10,-5 35,-65 -10,-60" fill="#1f0616"/>
    <!-- Tail -->
    <polygon points="-120,-5 -90,-5 -115,-50 -135,-50" fill="#1f0616"/>
    <!-- Engines -->
    <rect x="-5" y="14" width="35" height="12" rx="5" fill="#2b091f"/>
    <rect x="-15" y="-22" width="35" height="12" rx="5" fill="#1f0616"/>
  </g>

  <rect width="900" height="600" fill="none" stroke="#f4efe6" stroke-width="16" rx="20"/>
</svg>
